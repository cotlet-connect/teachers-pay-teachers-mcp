[project]
name = "teachers-pay-teachers-mcp"
version = "1.1.0"
description = "Connect Teachers Pay Teachers to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Teachers Pay Teachers API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["teachers pay teachers", "teachers pay teachers api", "teachers pay teachers mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/teachers-pay-teachers-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=teachers-pay-teachers"
Source = "https://github.com/cotlet-connect/teachers-pay-teachers-mcp"

[project.scripts]
teachers-pay-teachers-mcp = "teachers_pay_teachers_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"teachers_pay_teachers_agent.py" = "teachers_pay_teachers_agent.py"

[tool.hatch.build.targets.sdist]
include = ["teachers_pay_teachers_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
